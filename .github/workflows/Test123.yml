name: Build Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Dateien auflisten
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.exe | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer
          path: |
            **/bin/Release/**/*.exe
            **/publish/*.exe
            dist/**
          if-no-files-found: warn
