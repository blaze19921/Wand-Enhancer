name: Build Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: pnpm installieren
        run: npm install -g pnpm

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Gefundene EXE-Dateien anzeigen
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter *.exe | Where-Object { $_.FullName -notmatch '\\(obj|node_modules)\\' } | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer
          path: |
            dist/**
            **/publish/*.exe
            **/bin/Release/**/*.exe
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
            **/publish/*.exe
