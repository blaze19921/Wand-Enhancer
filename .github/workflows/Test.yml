name: Build Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore Wand-Enhancer.sln

      - name: Build
        run: msbuild Wand-Enhancer.sln /p:Configuration=Release /p:Platform="Any CPU" /restore

      - uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer
          path: WandEnhancer/bin/Release/**
          if-no-files-found: error

      - name: Zip für Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path WandEnhancer/bin/Release/* -DestinationPath WandEnhancer.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WandEnhancer.zip
